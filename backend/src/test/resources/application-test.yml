spring:
  datasource:
    url: jdbc:h2:mem:assetstudio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    root: target/test-uploads

simulation:
  asset-check-ms: 10
  generating-ms: 10
  finalizing-ms: 10